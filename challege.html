<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        form {
            width: 350px;
        }

        fieldset {
            border: 1px solid #767676;
            margin-bottom: 15px;
            padding: 10px 15px;
        }

        legend {
            font-weight: bold;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .form-group label {
            width: 140px;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            flex: 1;
            padding: 2px 4px;
        }

        .radio-group, .checkbox-group {
            font-size: 14px;
        }

        .radio-group label, .checkbox-group label {
            display: block;
            margin-bottom: 2px;
            font-weight: normal;
        }

        .buttons {
            margin-top: 10px;
        }

        .buttons input {
            padding: 2px 10px;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <form action="" method="POST">
        
        <!-- Group Akun -->
        <fieldset>
            <legend>Akun</legend>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <div class="form-group">
                <label for="konfirmasi">Konfirmasi Password</label>
                <input type="password" id="konfirmasi" name="konfirmasi">
            </div>
        </fieldset>

        <!-- Group Data -->
        <fieldset>
            <legend>Data</legend>
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama">
            </div>
            
            <div class="form-group" style="align-items: flex-start;">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label><input type="radio" name="jenis_kelamin" value="Pria"> Pria</label>
                    <label><input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
                </div>
            </div>

            <div class="form-group" style="align-items: flex-start;">
                <label>Informasi Yang Disukai</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                    <label><input type="checkbox" name="hobi[]" value="Travelling"> Travelling</label>
                    <label><input type="checkbox" name="hobi[]" value="Kesehatan"> Kesehatan</label>
                </div>
            </div>
        </fieldset>

        <!-- Tombol Aksi -->
        <div class="buttons">
            <input type="submit" value="Daftar">
            <input type="reset" value="reset">
        </div>

    </form>

</body>
</html>
