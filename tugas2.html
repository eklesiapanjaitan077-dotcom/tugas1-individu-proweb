<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <link rel="stylesheet" href="form.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Lato', sans-serif;
        }

        body {
            background-color: white;
            padding: 30px;
        }

        /* Judul */
        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 40px;
            font-weight: normal;
            color: #555;
        }

        /* Fieldset */
        fieldset {
            width: 450px;
            margin: auto;
            padding: 25px 30px;
            border: solid 1px #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* Label */
        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 18px;
            color: #444;
        }

        label:first-of-type {
            margin-top: 0;
        }

        /* Input */
        input {
            padding: 7px;
            border: solid 1px #999;
            border-radius: 3px;
            box-sizing: border-box;
        }

        input[type="text"] {
            width: 270px;
            height: 35px;
        }

        input[type="password"] {
            width: 270px;
            height: 35px;
        }

        /* Textarea */
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: solid 1px #999;
            border-radius: 3px;
            box-sizing: border-box;
            resize: none;
        }

        /* Program Studi */
        select {
            width: 270px;
            height: 35px;
            padding: 5px;
            border: solid 1px #999;
            border-radius: 3px;
        }

        /* Radio dan Checkbox */
        .checks {
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .checks p {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .checks label {
            display: inline-block;
            margin-top: 0;
            margin-right: 10px;
            font-size: 15px;
        }

        .checks input {
            margin-right: 4px;
        }

        /* Tombol */
        input[type="submit"] {
            margin-top: 15px;
            padding: 10px 25px;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
        }

        /* Untuk layar kecil */
        @media screen and (max-width: 600px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 30px;
            }

            fieldset {
                width: 100%;
            }

            input[type="text"],
            input[type="password"],
            select {
                width: 100%;
            }

            textarea {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Daftar Akun Baru</h1>

    <form>
        <fieldset>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <label for="alamat">Alamat:</label>
            <textarea id="alamat" name="alamat"
                placeholder="Input alamat disini"></textarea>

            <label for="prodi">Program Studi:</label>
            <select id="prodi" name="prodi">
                <option value="">-- Pilih Program Studi --</option>
                <option value="ti">Teknologi Informasi</option>
                <option value="si">Sistem Informasi</option>
                <option value="ilkom">Ilmu Komputer</option>
            </select>

            <div class="checks">
                <p>Jenis Kelamin:</p>

                <label>
                    <input type="radio" name="jenis_kelamin">
                    Laki-laki
                </label>

                <label>
                    <input type="radio" name="jenis_kelamin">
                    Perempuan
                </label>
            </div>

            <div class="checks">
                <p>Hobi:</p>

                <label>
                    <input type="checkbox" name="hobi">
                    Menggambar
                </label>

                <label>
                    <input type="checkbox" name="hobi">
                    Menulis
                </label>

                <label>
                    <input type="checkbox" name="hobi">
                    Fotografi
                </label>
            </div>

            <input type="submit" value="Daftar">

        </fieldset>
    </form>

</body>
</html>
